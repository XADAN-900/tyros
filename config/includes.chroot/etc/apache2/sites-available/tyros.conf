# TyrOS arayüzü — sadece bu bilgisayardan (127.0.0.1) erişilebilir.
<VirtualHost 127.0.0.1:80>
    ServerName localhost
    ServerAlias 127.0.0.1

    # HTML / CSS / JS arayüzü
    DocumentRoot /opt/tyros/ui
    <Directory /opt/tyros/ui>
        Options -Indexes
        Require all granted
    </Directory>
    Header always set X-Frame-Options SAMEORIGIN
    Header set Cache-Control "no-cache"

    ProxyPreserveHost On

    # Sistem köprüsü (tyros-api, kullanıcının oturumunda çalışır)
    ProxyPass        /api/ http://127.0.0.1:8090/api/
    ProxyPassReverse /api/ http://127.0.0.1:8090/api/

    # Gerçek terminal (ttyd, UNIX soketi üzerinden, WebSocket destekli)
    ProxyPass /term/ unix:/run/tyros/ttyd.sock|http://localhost/term/ upgrade=websocket

    ErrorLog ${APACHE_LOG_DIR}/tyros-error.log
    CustomLog ${APACHE_LOG_DIR}/tyros-access.log combined
</VirtualHost>
