# TyrOS: dizüstü dokunmatik yüzeyi — dokunarak tıklama açık, yazarken dokunmatik yüzey devre dışı
# (Ayarlar > Fare ve dokunmatik yüzey bölümünden değiştirilebilir)
Section "InputClass"
    Identifier      "TyrOS dokunmatik yüzey"
    MatchIsTouchpad "on"
    MatchDriver     "libinput"
    Option          "Tapping" "on"
    Option          "TappingButtonMap" "lrm"
    Option          "DisableWhileTyping" "on"
EndSection
