source /boot/grub/config.cfg

menuentry "TyrOS'u baslat" --hotkey=l {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "TyrOS (guvenli mod)" {
	linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
	initrd	@INITRD_LIVE@
}

submenu 'Araclar...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Bellek testi (varsa)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# UEFI ayar ekranı
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI ayarlari" --hotkey=f {
			fwsetup
		}
	fi

	# Kurulum ortamını doğrula
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Kurulum ortamini dogrula" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
